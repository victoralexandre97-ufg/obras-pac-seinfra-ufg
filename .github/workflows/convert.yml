name: Converter Excel para JSON

on:
  push:
    branches:
      - main
    paths:
      - '**.xlsb'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas pyxlsb

      - name: Run conversion script
        run: python convert_excel.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dados_obras.json
          git commit -m "Automated update: convert .xlsb to dados_obras.json [skip ci]" || echo "No changes to commit"
          git push
